# Generated into YTChannelScraper.xcodeproj by `xcodegen generate` (run from ios/).
#
# The project is kept as YAML rather than a checked-in .pbxproj because the iOS target
# deliberately compiles files that live in the *Mac* package — Model/ and Palette.swift
# are platform-clean and carry no AppKit — and expressing that as a plain path here is
# far less fragile than the file-reference soup Xcode would write for it. Nothing in
# mac/ is modified or moved; the sharing is one-directional.
name: YTChannelScraper

options:
  bundleIdPrefix: com.moregroup
  deploymentTarget:
    iOS: "17.0"        # @Observable, NavigationStack, .scrollTargetBehavior
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Personal/internal distribution: set DEVELOPMENT_TEAM in ios/Local.xcconfig (gitignored)
    # so a clone does not carry somebody else's team id around.
    CODE_SIGN_STYLE: Automatic

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

targets:
  YTChannelScraper:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Support/Assets.xcassets
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Shared with the Mac app, compiled in place. Both directories are AppKit-free —
      # verified by grep, and the build breaks loudly here if that ever stops being true.
      - path: ../mac/Sources/YTChannelScraper/Model
        name: Shared-Model
      - path: ../mac/Sources/YTChannelScraper/Core/Log.swift
        name: Shared-Log
      - path: ../mac/Sources/YTChannelScraper/Views/Palette.swift
        name: Shared-Palette
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: YT Scraper
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Downloads land in Documents/ and are meant to be reachable without the app:
        # these two keys are what put the folder in Files.app under "On My iPhone".
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio          # playback survives locking the screen
          - fetch          # background URLSession completion
        NSPhotoLibraryAddUsageDescription:
          Saves videos you download into your photo library.
        # The exported library type, matching Model/LibraryType.swift.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.moregroup.ytchannelscraper.library
            UTTypeDescription: YT Channel Scraper Library
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [ytcslib]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moregroup.ytchannelscraper
        INFOPLIST_KEY_CFBundleDisplayName: YT Scraper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"    # iPhone and iPad
