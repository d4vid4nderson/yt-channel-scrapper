# Generated into YTChannelScraper.xcodeproj by `xcodegen generate` (run from ios/).
#
# The project is kept as YAML rather than a checked-in .pbxproj because the iOS target
# deliberately compiles files that live in the *Mac* package — Model/ and Palette.swift
# are platform-clean and carry no AppKit — and expressing that as a plain path here is
# far less fragile than the file-reference soup Xcode would write for it. Nothing in
# mac/ is modified or moved; the sharing is one-directional.
name: YTChannelScraper

options:
  bundleIdPrefix: com.d4vid4nderson
  deploymentTarget:
    iOS: "17.0"        # @Observable, NavigationStack, .scrollTargetBehavior
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The build number, as a setting rather than a literal in the Info.plist below, so
    # `release.sh` can hand a fresh one to xcodebuild on every run — App Store Connect
    # refuses a number it has seen before, and remembering to bump it by hand is the step
    # that gets forgotten. Archiving from Xcode instead uses this default, which is only
    # ever right once.
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Personal/internal distribution: set DEVELOPMENT_TEAM in ios/Local.xcconfig (gitignored)
    # so a clone does not carry somebody else's team id around.
    CODE_SIGN_STYLE: Automatic
    # The App Group the app and its widgets share (see Shared/WidgetSnapshot.swift).
    # Derived from the bundle id so an override in Local.xcconfig carries it along.
    YTCS_APP_GROUP: group.$(YTCS_BUNDLE_ID:default=com.d4vid4nderson.ytchannelscraper)

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

targets:
  YTChannelScraper:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # What the app writes for the widgets and they read. Compiled into both.
      - path: Shared
      - path: Support/Assets.xcassets
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Shared with the Mac app, compiled in place. Both directories are AppKit-free —
      # verified by grep, and the build breaks loudly here if that ever stops being true.
      - path: ../mac/Sources/YTChannelScraper/Model
        name: Shared-Model
      - path: ../mac/Sources/YTChannelScraper/Core/Log.swift
        name: Shared-Log
      # The transfer format, shared so a .ytcslibrary written on the Mac opens on the
      # phone and back. Platform-clean apart from Paths.appName, which iOS also defines.
      - path: ../mac/Sources/YTChannelScraper/Core/LibraryArchive.swift
        name: Shared-Archive
      - path: ../mac/Sources/YTChannelScraper/Views/Palette.swift
        name: Shared-Palette
      # The themes Palette reads its colours from, shared for the same reason.
      - path: ../mac/Sources/YTChannelScraper/Views/Theme.swift
        name: Shared-Theme
      # The iCloud mirror, shared for the same reason as the archive above: both apps
      # write the same library to the same key-value container, and one implementation
      # is the only way that stays true.
      - path: ../mac/Sources/YTChannelScraper/Core/CloudMirror.swift
        name: Shared-Cloud
      # The shelf, shared so a guardian can approve from either machine. Only the store
      # and the merge rules travel: `ShelfReconciler` stays on iOS because it depends on
      # `Downloads` and `LocalFiles`, and because only a minor's device reconciles — a
      # Mac is a guardian's machine and has nothing to reconcile.
      # Guardian and Minor identity live here, so the shelf's `Profiles.Minor` means the
      # same type in both apps. Minor Mode's PIN travels with it and is simply unused on
      # the Mac — cheaper than splitting one small file in two.
      - path: ../mac/Sources/YTChannelScraper/Core/Profiles.swift
        name: Shared-Profiles
      - path: ../mac/Sources/YTChannelScraper/Core/Shelf.swift
        name: Shared-Shelf
      - path: ../mac/Sources/YTChannelScraper/Core/ShelfStore.swift
        name: Shared-ShelfStore
      # What the Mac hands a child's phone over the cable. Shared because the two halves
      # have to agree on the bytes.
      - path: ../mac/Sources/YTChannelScraper/Core/ChildSetup.swift
        name: Shared-ChildSetup
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: YT Player
        # Where the widgets' snapshot lives. Read at run time by WidgetSnapshot.container.
        YTCSAppGroup: $(YTCS_APP_GROUP)
        # The widgets' links into the app: ytplayer://video/<id>, ytplayer://search and so
        # on. See WidgetLink, which is also where the reasons it is safe to register live.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).widget-links
            CFBundleURLSchemes: [ytplayer]
        # The long-press menu on the Home Screen icon. Handled in App/QuickActions.swift,
        # which matches on the type string.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.d4vid4nderson.ytchannelscraper.changeTheme
            UIApplicationShortcutItemTitle: Change Theme
            UIApplicationShortcutItemIconSymbolName: paintpalette
        # App Store Connect rejects an upload without this (ITMS-90713), and nothing
        # catches it until you try. Xcode injects it for itself when it generates the
        # Info.plist, but this target supplies its own, so `actool` writes the nested
        # CFBundleIcons dictionaries and leaves the top-level key the validator actually
        # reads unset. Stating it here is the whole fix.
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0.0"
        # Set by `release.sh` on every run, from the clock — App Store Connect refuses a
        # build number it has already seen, and a TestFlight build expires 90 days after
        # upload, so this gets bumped for the life of the app. See CURRENT_PROJECT_VERSION
        # above for what an Xcode-side archive gets instead.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Answers the export-compliance question up front. The app talks HTTPS and
        # nothing else, which is the exempt case. Without this key App Store Connect
        # asks on every single upload and holds the build until someone answers.
        ITSAppUsesNonExemptEncryption: false
        # Minor Mode's PIN can optionally be answered with Face ID instead. Required the
        # moment LocalAuthentication is linked and asked to evaluate a biometric policy
        # — the system kills the app rather than prompting if the key is absent, and
        # only at the point someone actually taps the button.
        NSFaceIDUsageDescription: Unlock Minor Mode without typing your PIN.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The phone gets three: upside-down is not a thing a Face ID iPhone honours
        # anyway, and declaring it would only matter on the few that do.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The iPad gets all four, and has to. An iPad app that supports multitasking must
        # declare every orientation — App Store Connect *rejects the upload* otherwise
        # (ITMS, "to support iPad multitasking"), which is a validation failure after the
        # archive rather than a build error, so nothing catches it until you upload. The
        # alternative, UIRequiresFullScreen, is on its way out: from the iOS 26 SDK
        # windows are resizable regardless, so opting out is no longer an option worth
        # building on.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Downloads land in Documents/ and are meant to be reachable without the app:
        # these two keys are what put the folder in Files.app under "On My iPhone".
        # Deliberately the only destination — saving into the photo library would mean
        # asking for NSPhotoLibraryAddUsageDescription, and an app that requests a
        # permission it then never uses is worse than one that does not ask.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio          # playback survives locking the screen
          - fetch          # background URLSession completion
        # The exported library type, matching Model/LibraryType.swift.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.d4vid4nderson.ytchannelscraper.library
            UTTypeDescription: YT Parent Command Center Library
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [ytcslibrary]
    # The iCloud key-value store, which is what makes the library survive the app being
    # deleted. `$(TeamIdentifierPrefix)$(CFBundleIdentifier)` is the conventional
    # container name and keeps this working if the bundle id is overridden in
    # Local.xcconfig — a literal here would break for anyone signing with another team.
    #
    # Adding this changes the App ID's capabilities, so the first archive after it has to
    # regenerate the provisioning profile. `release.sh` already passes
    # -allowProvisioningUpdates, which is what lets that happen without a dialog.
    entitlements:
      path: Support/YTChannelScraper.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # Shared with the widget extension. A new capability, so the first archive after
        # it regenerates the profiles — which -allowProvisioningUpdates allows.
        com.apple.security.application-groups: [$(YTCS_APP_GROUP)]
    dependencies:
      - target: YTPlayerWidget

    settings:
      base:
        # Overridable from Local.xcconfig. A plain value here would silently beat
        # the xcconfig — target-level build settings outrank it — which made the
        # "change this if the id is taken" note over there a lie.
        PRODUCT_BUNDLE_IDENTIFIER: $(YTCS_BUNDLE_ID:default=com.d4vid4nderson.ytchannelscraper)
        INFOPLIST_KEY_CFBundleDisplayName: YT Player
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # One per theme, switched to with the theme — see ThemeChrome.applyIcon and
        # make-icon.sh, which generates them.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-bladeRunner AppIcon-dune AppIcon-middleEarth AppIcon-prancingPony AppIcon-synthwave AppIcon-grid AppIcon-nostromo AppIcon-nostromoTeal"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"    # iPhone and iPad

  # The Home and Lock Screen widgets. They draw only what the app writes into the shared
  # App Group, and never touch the library, the shelf or the network themselves — see
  # WidgetFeed for why that matters on a minor's phone.
  YTPlayerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: YT Player
        YTCSAppGroup: $(YTCS_APP_GROUP)
        # Must match the app's, or the install is refused.
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/Widget.entitlements
      properties:
        com.apple.security.application-groups: [$(YTCS_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YTCS_BUNDLE_ID:default=com.d4vid4nderson.ytchannelscraper).widget
        # Swaps in the empty PlayerRemote in Shared/PlayerIntents.swift.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  # Unit tests for the parts that have to be right and do not need a device: the shelf
  # merge rules, and anything else that is pure. Deliberately a *logic* test bundle with
  # no host application — it never launches the app, so it runs in a couple of seconds
  # and cannot be broken by a signing problem, which is what makes it worth running.
  #
  #   xcodebuild test -scheme YTChannelScraperTests -destination 'platform=iOS Simulator,name=iPhone 16'
  YTChannelScraperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: YTChannelScraper
    settings:
      base:
        # @testable needs the app built without optimisation stripping its internals.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(YTCS_BUNDLE_ID:default=com.d4vid4nderson.ytchannelscraper).tests

schemes:
  YTChannelScraper:
    build:
      targets:
        YTChannelScraper: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YTChannelScraperTests
    archive:
      config: Release
